
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-label="Animated customer intelligence and business impact dashboard">
<title>Customer Intelligence, Business Decisions and Operational Impact</title>
<desc>Animated business intelligence dashboard showing customer identification improvement, matching analysis, distributor coverage, workflow, revenue opportunities, time efficiency and annualized labor cost equivalent.</desc>

<defs>
  <linearGradient id="background" x2="1" y2="1">
    <stop offset="0" stop-color="#071421"/>
    <stop offset="1" stop-color="#102d45"/>
  </linearGradient>
  <linearGradient id="panel" x2="0" y2="1">
    <stop offset="0" stop-color="#193451"/>
    <stop offset="1" stop-color="#0b2034"/>
  </linearGradient>
  <linearGradient id="blue" x2="1">
    <stop stop-color="#2479ed"/>
    <stop offset="1" stop-color="#54d4ff"/>
  </linearGradient>
  <linearGradient id="green" x2="1">
    <stop stop-color="#14b987"/>
    <stop offset="1" stop-color="#83fac0"/>
  </linearGradient>
  <clipPath id="billArea">
    <rect x="1100" y="888" width="240" height="66" rx="7"/>
  </clipPath>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .heading{fill:#f5f9ff;font-weight:700}
    .muted{fill:#afc8dd}
    .panel{fill:url(#panel);stroke:#4e7798;stroke-width:1.5}
    .number{fill:white;font-size:37px;font-weight:800}
    .gridline{stroke:#385875;stroke-width:1}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:rise 12s ease-in-out infinite}
    @keyframes rise{
      0%,5%{transform:scaleY(.02)}
      36%,94%{transform:scaleY(1)}
      100%{transform:scaleY(.02)}
    }
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{
      0%,100%{opacity:.55}
      50%{opacity:1}
    }
  </style>
  <g id="bill">
    <rect width="47" height="25" rx="4" fill="#35b977" stroke="#a6ffd0" stroke-width="1.5"/>
    <rect x="5" y="4" width="37" height="17" rx="2" fill="none" stroke="#baffd9"/>
    <circle cx="23.5" cy="12.5" r="8" fill="#14633e"/>
    <text x="23.5" y="17.5" text-anchor="middle" fill="#e0ffec" font-size="14" font-weight="bold">$</text>
  </g>
  <g id="person">
    <circle r="9" fill="#58caff"/>
    <path d="M-13 23Q-13 6 0 6Q13 6 13 23Z" fill="#268fe0"/>
  </g>
</defs>

<rect width="1400" height="1080" rx="22" fill="url(#background)"/>

