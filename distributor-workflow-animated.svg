
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="900"
     viewBox="0 0 1400 900"
     role="img"
     aria-label="Animated CRM customer identification, business intelligence, and operational impact dashboard">

<title>Customer Data Intelligence and Business Impact</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071422"/>
    <stop offset="1" stop-color="#102c44"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#183451"/>
    <stop offset="1" stop-color="#0b2034"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2675ef"/>
    <stop offset="1" stop-color="#56d5ff"/>
  </linearGradient>

  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#17bf88"/>
    <stop offset="1" stop-color="#81f8be"/>
  </linearGradient>

  <clipPath id="moneyClip">
    <rect x="1150" y="685" width="158" height="59" rx="6"/>
  </clipPath>

  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
    }

    .title {
      fill: #f5f9ff;
      font-weight: 700;
    }

    .muted {
      fill: #adc6dc;
    }

    .panel {
      fill: url(#card);
      stroke: #4c7395;
      stroke-width: 1.5;
    }

    .number {
      fill: #ffffff;
      font-size: 37px;
      font-weight: 800;
    }

    .gridline {
      stroke: #385673;
      stroke-width: 1;
    }

    .grow {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: grow 12s ease-in-out infinite;
    }

    @keyframes grow {
      0%, 6% {
        transform: scaleY(.02);
      }

      35%, 94% {
        transform: scaleY(1);
      }

      100% {
        transform: scaleY(.02);
      }
    }
  </style>

  <g id="bill">
    <rect width="48" height="24" rx="4"
          fill="#38b978"
          stroke="#a6ffd0"
          stroke-width="1.5"/>

    <rect x="5" y="4" width="38" height="16"
          rx="2"
          fill="none"
          stroke="#baffd9"/>

    <circle cx="24" cy="12" r="8" fill="#14633e"/>

    <text x="24" y="17"
          font-size="14"
          text-anchor="middle"
          fill="#d5ffe5"
          font-weight="bold">$</text>
  </g>
</defs>

