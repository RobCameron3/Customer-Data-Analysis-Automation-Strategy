
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="1180"
     viewBox="0 0 1400 1180"
     role="img"
     aria-label="Customer intelligence and operational impact dashboard">

<title>Customer Intelligence, Operational Efficiency and Business Impact</title>
<desc>
Animated portfolio dashboard showing customer identification improvement,
research coverage, distributor concentration, backlog elimination,
and purchasing intelligence capabilities.
</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071421"/>
    <stop offset="1" stop-color="#102d45"/>
  </linearGradient>

  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#193451"/>
    <stop offset="1" stop-color="#0b2034"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2479ed"/>
    <stop offset="1" stop-color="#54d4ff"/>
  </linearGradient>

  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .heading{fill:#f5f9ff;font-weight:700}
    .muted{fill:#afc8dd}
    .panel{
      fill:url(#panel);
      stroke:#4e7798;
      stroke-width:1.5;
    }
    .subpanel{
      fill:#102a40;
      stroke:#4c8db4;
      stroke-width:1.5;
    }
    .success{
      fill:#83fac0;
      font-weight:bold;
    }
    .gridline{stroke:#385875;stroke-width:1}

    .bar{
      fill:url(#blue);
      transform-box:fill-box;
      transform-origin:center bottom;
      animation:grow 20s infinite;
    }

    .coverage{
      stroke-dasharray:100;
      animation:draw 20s infinite;
    }

    .donut{
      animation:donutReveal 20s infinite;
    }

    .people{
      animation:appear 20s infinite;
    }

    .flow{
      stroke-dasharray:100;
      animation:flowDraw 20s infinite;
    }

    .check{
      stroke-dasharray:100;
      animation:checkDraw 20s infinite;
    }

    .reveal{
      animation:reveal 20s infinite;
    }

    .monthly{
      animation:monthlyGlow 20s infinite;
    }
    .quarterly{
      animation:quarterlyGlow 20s infinite;
    }
    .annual{
      animation:annualGlow 20s infinite;
    }

    @keyframes grow{
      0%,4%{transform:scaleY(0)}
      18%,98%{transform:scaleY(1)}
      100%{transform:scaleY(0)}
    }
    @keyframes draw{
      0%,10%{stroke-dashoffset:100}
      24%,98%{stroke-dashoffset:0}
      100%{stroke-dashoffset:100}
    }
    @keyframes donutReveal{
      0%,7%{stroke-dasharray:0 560}
      24%,98%{stroke-dasharray:459 560}
      100%{stroke-dasharray:0 560}
    }
    @keyframes appear{
      0%,20%{opacity:0}
      30%,98%{opacity:1}
      100%{opacity:0}
    }
    @keyframes flowDraw{
      0%,25%{stroke-dashoffset:100}
      38%,98%{stroke-dashoffset:0}
      100%{stroke-dashoffset:100}
    }
    @keyframes checkDraw{
      0%,30%{stroke-dashoffset:100}
      40%,98%{stroke-dashoffset:0}
      100%{stroke-dashoffset:100}
    }
    @keyframes reveal{
      0%,37%{opacity:0}
      47%,98%{opacity:1}
      100%{opacity:0}
    }
    @keyframes monthlyGlow{
      0%,40%,100%{opacity:.45}
      45%,55%{opacity:1}
      60%{opacity:.45}
    }
    @keyframes quarterlyGlow{
      0%,53%,100%{opacity:.45}
      58%,68%{opacity:1}
      73%{opacity:.45}
    }
    @keyframes annualGlow{
      0%,66%,100%{opacity:.45}
      71%,81%{opacity:1}
      86%{opacity:.45}
    }

    @media(prefers-reduced-motion:reduce){
      *{animation:none!important}
    }
  </style>

  <g id="person">
    <circle r="9" fill="#58caff"/>
    <path d="M-13 23Q-13 6 0 6Q13 6 13 23Z"
          fill="#268fe0"/>
  </g>
</defs>

