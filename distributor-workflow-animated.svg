
<!-- ANIMATED IDENTIFICATION SUCCESS BARS -->
<rect x="170" y="417.4" width="125" height="140.6"
      rx="5" fill="url(#blue)">
  <animate attributeName="height"
           values="0;140.6;140.6"
           keyTimes="0;.35;1"
           dur="12s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="558;417.4;417.4"
           keyTimes="0;.35;1"
           dur="12s" repeatCount="indefinite"/>
</rect>

<rect x="418" y="429.3" width="125" height="128.7"
      rx="5" fill="url(#blue)">
  <animate attributeName="height"
           values="0;128.7;128.7"
           keyTimes="0;.35;1"
           dur="12s" repeatCount="indefinite"/>
  <animate attributeName="y"
           values="558;429.3;429.3"
           keyTimes="0;.35;1"
           dur="12s" repeatCount="indefinite"/>
</rect>

<!-- IDENTIFICATION SUCCESS VALUES -->
<!-- Positioned near the bottom of each blue bar -->
<g fill="#ffffff" font-size="20"
   font-weight="bold" text-anchor="middle">
  <text x="232" y="539">92.5%</text>
  <text x="480" y="539">84.7%</text>
</g>

<!-- RESEARCH COVERAGE LINE -->
<path d="M232 500.1 L480 476.5"
      fill="none"
      stroke="#65efb0"
      stroke-width="5"
      stroke-linecap="round"
      pathLength="100"
      stroke-dasharray="100"
      stroke-dashoffset="100">
  <animate attributeName="stroke-dashoffset"
           values="100;0;0"
           keyTimes="0;.35;1"
           dur="12s"
           repeatCount="indefinite"/>
</path>

<!-- GREEN DATA POINTS -->
<circle cx="232" cy="500.1" r="8"
        fill="#76f7b9"/>

<circle cx="480" cy="476.5" r="8"
        fill="#76f7b9"/>

<!-- DARK LABEL BACKGROUNDS FOR CONTRAST -->
<rect x="187" y="448" width="90" height="31"
      rx="7"
      fill="#092337"
      stroke="#65efb0"
      stroke-width="1.5"/>

<rect x="435" y="424" width="90" height="31"
      rx="7"
      fill="#092337"
      stroke="#65efb0"
      stroke-width="1.5"/>

